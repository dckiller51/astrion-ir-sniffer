<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astrion IR Database — Sélecteur</title>
<style>
  :root{
    --bg: #12151a;
    --panel: #1a1e25;
    --panel-2: #20242c;
    --border: #2a2f38;
    --text: #ecece7;
    --text-dim: #9aa1ab;
    --text-faint: #626973;
    --signal: #ff7a45;
    --signal-dim: #7a3d24;
    --ok: #5fb488;
    --mono: 'SF Mono', 'JetBrains Mono', 'Consolas', 'Menlo', monospace;
    --sans: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display:flex;
    flex-direction:column;
  }

  /* ---- header ------------------------------------------------------ */
  header{
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--border);
  }
  header .header-top{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 16px;
  }
  .lang-switch button{
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 5px;
    padding: 5px 11px;
    font-size: 0.75rem;
    font-family: var(--sans);
    cursor: pointer;
    margin-left: 5px;
  }
  .lang-switch button.active{
    background: var(--signal);
    border-color: var(--signal);
    color: #1a0e08;
  }
  header .signal-dot{
    display:inline-block;
    width:8px; height:8px;
    border-radius:50%;
    background: var(--signal);
    box-shadow: 0 0 10px 2px var(--signal-dim);
    margin-right:10px;
    vertical-align: middle;
  }
  h1{
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
    display:flex;
    align-items:center;
  }
  header p{
    margin: 0;
    color: var(--text-dim);
    font-size: 0.92rem;
    line-height: 1.5;
    max-width: 640px;
  }
  header code{
    font-family: var(--mono);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 0.85em;
    color: var(--text);
  }

  /* ---- layout -------------------------------------------------------*/
  .layout{
    flex: 1;
    display: flex;
    min-height: 0;
  }

  /* category rail */
  nav.categories{
    width: 220px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    padding: 16px 10px;
    overflow-y: auto;
  }
  nav.categories button{
    display:flex;
    justify-content: space-between;
    align-items:center;
    width:100%;
    background: none;
    border: none;
    color: var(--text-dim);
    text-align: left;
    padding: 10px 12px;
    margin-bottom: 2px;
    border-radius: 6px;
    font-size: 0.92rem;
    cursor: pointer;
    font-family: var(--sans);
  }
  nav.categories button:hover{ background: var(--panel); color: var(--text); }
  nav.categories button.active{ background: var(--panel-2); color: var(--text); }
  nav.categories button.active .cat-label{ color: var(--signal); }
  nav.categories .cat-count{
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--text-faint);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1px 7px;
    min-width: 20px;
    text-align:center;
  }
  nav.categories button.has-selection .cat-count{
    color: var(--signal);
    border-color: var(--signal-dim);
  }

  /* main panel */
  main{
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .toolbar{
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display:flex;
    gap: 12px;
    align-items:center;
  }
  .toolbar input[type=search]{
    flex: 1;
    max-width: 360px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 9px 12px;
    font-size: 0.9rem;
    font-family: var(--sans);
  }
  .toolbar input[type=search]:focus{ outline: none; border-color: var(--signal-dim); }
  .toolbar .toolbar-btn{
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: var(--sans);
  }
  .toolbar .toolbar-btn:hover{ color: var(--text); border-color: var(--text-faint); }

  .tree{
    flex: 1;
    overflow-y: auto;
    padding: 8px 24px 24px;
  }
  .empty-state{
    color: var(--text-faint);
    font-size: 0.9rem;
    padding: 60px 0;
    text-align: center;
  }

  .brand-block{
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .brand-row{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 6px 4px;
    cursor: pointer;
    user-select: none;
  }
  .brand-row .chevron{
    color: var(--text-faint);
    font-size: 0.7rem;
    width: 12px;
    transition: transform 0.15s ease;
  }
  .brand-row.open .chevron{ transform: rotate(90deg); }
  .brand-row .brand-name{
    font-weight: 600;
    font-size: 0.95rem;
    flex: 1;
  }
  .brand-row .brand-meta{
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--text-faint);
  }
  .models{
    display: none;
    padding-left: 32px;
    margin-top: 4px;
  }
  .models.open{ display: block; }
  .model-row{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 7px 4px;
    border-radius: 5px;
  }
  .model-row:hover{ background: var(--panel); }
  .model-row .model-name{
    flex:1;
    font-size: 0.88rem;
    color: var(--text-dim);
  }
  .model-row.checked .model-name{ color: var(--text); }
  .model-row .cmd-count{
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--text-faint);
  }

  input[type=checkbox]{
    width: 15px; height: 15px;
    accent-color: var(--signal);
    cursor: pointer;
    flex-shrink: 0;
  }

  mark{
    background: var(--signal-dim);
    color: var(--text);
    border-radius: 2px;
    padding: 0 1px;
  }

  /* ---- footer bar ----------------------------------------------------*/
  footer{
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 14px 24px;
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  footer .selection-summary{
    font-size: 0.85rem;
    color: var(--text-dim);
  }
  footer .selection-summary strong{
    color: var(--text);
    font-family: var(--mono);
  }
  footer .actions{
    display:flex;
    gap: 10px;
    align-items:center;
  }
  .btn-generate{
    background: var(--signal);
    color: #1a0e08;
    border: none;
    border-radius: 6px;
    padding: 10px 20px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--sans);
  }
  .btn-generate:disabled{
    background: var(--panel-2);
    color: var(--text-faint);
    cursor: not-allowed;
  }
  .btn-generate:not(:disabled):hover{ filter: brightness(1.08); }
  .btn-save-direct{
    background: none;
    color: var(--signal);
    border: 1px solid var(--signal-dim);
    border-radius: 6px;
    padding: 9px 16px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--sans);
  }
  .btn-save-direct:disabled{
    color: var(--text-faint);
    border-color: var(--border);
    cursor: not-allowed;
  }
  .btn-save-direct:not(:disabled):hover{ background: var(--panel-2); }
  .btn-clear{
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 0.82rem;
    cursor: pointer;
    text-decoration: underline;
    font-family: var(--sans);
  }
  .btn-clear:hover{ color: var(--text-dim); }

  .status-line{
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--ok);
    padding: 0 24px 10px;
    min-height: 1.2em;
  }

  @media (max-width: 700px){
    .layout{ flex-direction: column; }
    nav.categories{
      width: 100%;
      border-right: none;
      border-bottom: 1px solid var(--border);
      display:flex;
      overflow-x:auto;
      padding: 10px;
      white-space: nowrap;
    }
    nav.categories button{ width:auto; flex-shrink:0; margin-right: 4px; }
    header{ padding: 20px 18px 16px; }
    .toolbar, .tree{ padding-left: 18px; padding-right: 18px; }
    .toolbar{ flex-wrap: wrap; }
    .toolbar input[type=search]{ max-width: none; flex-basis: 100%; }
    footer{ padding: 14px 18px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1><span class="signal-dot"></span><span data-i18n="title">Astrion IR Database</span></h1>
    <div class="lang-switch">
      <button id="btn-en" onclick="setLanguage('en')" class="active">EN</button>
      <button id="btn-fr" onclick="setLanguage('fr')">FR</button>
    </div>
  </div>
  <p data-i18n="desc">
    Check the devices you own. "Generate files" downloads one JSON file per
    selected category, in the same format as
    <code>ir-database/&lt;category&gt;.json</code> — ready to copy as-is
    onto the remote, into <code>/sdcard/astrion/ir-database/</code>.
  </p>
</header>

<div class="layout">
  <nav class="categories" id="categoryNav"></nav>

  <main>
    <div class="toolbar">
      <input type="search" id="searchBox" data-i18n-placeholder="search_placeholder" placeholder="Filter by brand or model…" disabled>
      <button class="toolbar-btn" id="selectAllBtn" data-i18n="btn_select_all" disabled>Select all (category)</button>
      <button class="toolbar-btn" id="deselectAllBtn" data-i18n="btn_deselect_all" disabled>Deselect all (category)</button>
    </div>
    <div class="tree" id="tree">
      <div class="empty-state" data-i18n="loading_catalog">Loading catalog…</div>
    </div>
  </main>
</div>

<div class="status-line" id="statusLine"></div>
<footer>
  <div class="selection-summary" id="selectionSummary" data-i18n="summary_none">No device selected</div>
  <div class="actions">
    <button class="btn-clear" id="clearAllBtn" data-i18n="btn_clear_all">Clear all</button>
    <button class="btn-save-direct" id="sendRemoteBtn" data-i18n="btn_send_remote" disabled>Send to my remote…</button>
    <button class="btn-save-direct" id="saveDirectBtn" data-i18n="btn_save_direct" disabled style="display:none">Save to a folder…</button>
    <button class="btn-generate" id="generateBtn" data-i18n="btn_generate" disabled>Generate files</button>
  </div>
</footer>

<script>
(function(){
  'use strict';

  const translations = {
    en: {
      title: "Astrion IR Database",
      desc: 'Check the devices you own. "Generate files" downloads one JSON file per selected category, in the same format as <code>ir-database/&lt;category&gt;.json</code> — ready to copy as-is onto the remote, into <code>/sdcard/astrion/ir-database/</code>.',
      search_placeholder: "Filter by brand or model…",
      btn_select_all: "Select all (category)",
      btn_deselect_all: "Deselect all (category)",
      btn_clear_all: "Clear all",
      btn_generate: "Generate files",
      btn_save_direct: "Save to a folder…",
      btn_send_remote: "Send to my remote…",
      remote_ip_prompt: "IP address of your Astrion remote (Settings → Wi-Fi shows it), e.g. 192.168.2.175:",
      status_sending_remote: "Sending {n} file(s) to {ip}…",
      status_sent_remote: "Sent {n} file(s) to the remote — picked up immediately, no restart needed.",
      status_send_remote_blocked: "Blocked by the browser ({error}) — likely mixed-content protection, since this page is HTTPS and the remote's local server is plain HTTP. Try \"Generate files\" and copy them over instead.",
      summary_none: "No device selected",
      summary_n: "<strong>{n}</strong> device selected|<strong>{n}</strong> devices selected",
      choose_category: "Choose a category on the left.",
      loading_catalog: "Loading catalog…",
      loading_file: "Loading {file}…",
      load_error_file: "Couldn't load {file}.",
      no_results: 'No results for "{query}".',
      index_load_error: 'Couldn\'t load index.json. This page must be served over http(s) (GitHub Pages, or <code>npx http-server</code> locally) — it won\'t work opened directly as a local file (file://).',
      cmd_count: "{n} cmd",
      status_generating: "Generating {n} file(s)…",
      status_done: "{n} file(s) downloaded — copy them to /sdcard/astrion/ir-database/ on the remote.",
      status_saving_direct: "Saving {n} file(s) to the folder you picked…",
      status_saved_direct: "Saved {n} file(s) directly to \"{folder}/ir-database/\".",
      status_save_direct_cancelled: "Cancelled — nothing was saved.",
      status_save_direct_error: "Couldn't save directly ({error}) — use \"Generate files\" to download instead."
    },
    fr: {
      title: "Astrion IR Database",
      desc: 'Cochez les appareils que vous possédez. « Générer les fichiers » télécharge un fichier JSON par catégorie sélectionnée, dans le même format que <code>ir-database/&lt;catégorie&gt;.json</code> — prêt à copier tel quel sur la télécommande, dans <code>/sdcard/astrion/ir-database/</code>.',
      search_placeholder: "Filtrer par marque ou modèle…",
      btn_select_all: "Tout cocher (catégorie)",
      btn_deselect_all: "Tout décocher (catégorie)",
      btn_clear_all: "Tout effacer",
      btn_generate: "Générer les fichiers",
      btn_save_direct: "Enregistrer dans un dossier…",
      btn_send_remote: "Envoyer vers ma télécommande…",
      remote_ip_prompt: "Adresse IP de votre télécommande Astrion (Paramètres → Wi-Fi l'affiche), ex. 192.168.2.175 :",
      status_sending_remote: "Envoi de {n} fichier(s) vers {ip}…",
      status_sent_remote: "{n} fichier(s) envoyé(s) à la télécommande — pris en compte immédiatement, pas besoin de redémarrer.",
      status_send_remote_blocked: "Bloqué par le navigateur ({error}) — probablement la protection contenu-mixte, cette page étant en HTTPS et le serveur local de la télécommande en HTTP simple. Utilisez « Générer les fichiers » et copiez-les à la place.",
      summary_none: "Aucun appareil sélectionné",
      summary_n: "<strong>{n}</strong> appareil sélectionné|<strong>{n}</strong> appareils sélectionnés",
      choose_category: "Choisissez une catégorie à gauche.",
      loading_catalog: "Chargement du catalogue…",
      loading_file: "Chargement de {file}…",
      load_error_file: "Impossible de charger {file}.",
      no_results: "Aucun résultat pour « {query} ».",
      index_load_error: "Impossible de charger index.json. Cette page doit être servie en http(s) (GitHub Pages, ou <code>npx http-server</code> en local) — elle ne fonctionne pas ouverte directement en fichier local (file://).",
      cmd_count: "{n} cmd",
      status_generating: "Génération de {n} fichier(s)…",
      status_done: "{n} fichier(s) téléchargé(s) — copiez-les dans /sdcard/astrion/ir-database/ sur la télécommande.",
      status_saving_direct: "Enregistrement de {n} fichier(s) dans le dossier choisi…",
      status_saved_direct: "{n} fichier(s) enregistré(s) directement dans « {folder}/ir-database/ ».",
      status_save_direct_cancelled: "Annulé — rien n'a été enregistré.",
      status_save_direct_error: "Échec de l'enregistrement direct ({error}) — utilisez « Générer les fichiers » pour télécharger à la place."
    }
  };

  let currentLang = 'en';

  // Simple {placeholder} substitution, with an optional "singular|plural"
  // split on {n} for the one string that needs it (English and French
  // don't pluralize at the same count in general, but both happen to be
  // "n == 1" here, which is all this needs).
  function t(key, vars){
    let str = translations[currentLang][key] || key;
    if (str.indexOf('|') !== -1 && vars && typeof vars.n === 'number'){
      const [singular, plural] = str.split('|');
      str = vars.n === 1 ? singular : plural;
    }
    if (vars){
      Object.keys(vars).forEach(k => {
        str = str.split('{' + k + '}').join(escapeHtml(String(vars[k])));
      });
    }
    return str;
  }

  function setLanguage(lang){
    currentLang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (translations[lang][key]) el.innerHTML = translations[lang][key];
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      const key = el.getAttribute('data-i18n-placeholder');
      if (translations[lang][key]) el.placeholder = translations[lang][key];
    });
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
    document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');
    // Re-render everything built dynamically in JS (category nav labels
    // come from the user's own index.json and stay as-is — only this
    // tool's own chrome, all routed through t(), needs a re-render).
    renderCategoryNav();
    renderTree();
    refreshChrome();
  }
  window.setLanguage = setLanguage;

  // category id -> { label, file, data (lazy), selected: Map(brand_name -> Set(model_name)) }
  const categories = new Map();
  let activeCategoryId = null;
  let currentSearch = '';

  const categoryNav = document.getElementById('categoryNav');
  const tree = document.getElementById('tree');
  const searchBox = document.getElementById('searchBox');
  const selectAllBtn = document.getElementById('selectAllBtn');
  const deselectAllBtn = document.getElementById('deselectAllBtn');
  const clearAllBtn = document.getElementById('clearAllBtn');
  const generateBtn = document.getElementById('generateBtn');
  const saveDirectBtn = document.getElementById('saveDirectBtn');
  const sendRemoteBtn = document.getElementById('sendRemoteBtn');
  const selectionSummary = document.getElementById('selectionSummary');
  const statusLine = document.getElementById('statusLine');

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[c]));
  }

  function highlight(text, query){
    if (!query) return escapeHtml(text);
    const idx = text.toLowerCase().indexOf(query.toLowerCase());
    if (idx === -1) return escapeHtml(text);
    return escapeHtml(text.slice(0, idx))
      + '<mark>' + escapeHtml(text.slice(idx, idx + query.length)) + '</mark>'
      + escapeHtml(text.slice(idx + query.length));
  }

  // ---- selection bookkeeping ---------------------------------------

  function isModelSelected(catId, brand, model){
    const cat = categories.get(catId);
    return !!(cat.selected.get(brand) && cat.selected.get(brand).has(model));
  }

  function setModelSelected(catId, brand, model, on){
    const cat = categories.get(catId);
    if (on){
      if (!cat.selected.has(brand)) cat.selected.set(brand, new Set());
      cat.selected.get(brand).add(model);
    } else if (cat.selected.has(brand)){
      cat.selected.get(brand).delete(model);
      if (cat.selected.get(brand).size === 0) cat.selected.delete(brand);
    }
  }

  function categorySelectionCount(catId){
    const cat = categories.get(catId);
    let n = 0;
    cat.selected.forEach(models => { n += models.size; });
    return n;
  }

  function totalSelectionCount(){
    let n = 0;
    categories.forEach((cat, id) => { n += categorySelectionCount(id); });
    return n;
  }

  // ---- rendering ------------------------------------------------------

  function renderCategoryNav(){
    categoryNav.innerHTML = '';
    categories.forEach((cat, id) => {
      const btn = document.createElement('button');
      const count = categorySelectionCount(id);
      if (id === activeCategoryId) btn.classList.add('active');
      if (count > 0) btn.classList.add('has-selection');
      btn.innerHTML =
        '<span class="cat-label">' + escapeHtml(cat.label) + '</span>' +
        '<span class="cat-count">' + count + '</span>';
      btn.addEventListener('click', () => selectCategory(id));
      categoryNav.appendChild(btn);
    });
  }

  function renderTree(){
    const cat = categories.get(activeCategoryId);
    if (!cat){
      tree.innerHTML = '<div class="empty-state">' + t('choose_category') + '</div>';
      return;
    }
    if (cat.loading){
      tree.innerHTML = '<div class="empty-state">' + t('loading_file', {file: cat.file}) + '</div>';
      return;
    }
    if (cat.loadError){
      tree.innerHTML = '<div class="empty-state">' + t('load_error_file', {file: cat.file}) + '</div>';
      return;
    }

    const query = currentSearch.trim().toLowerCase();
    const brands = (cat.data && cat.data.brands) || [];
    const filtered = [];

    brands.forEach(brand => {
      const brandMatches = brand.brand_name.toLowerCase().includes(query);
      const models = (brand.models || []).filter(m =>
        !query || brandMatches || m.model_name.toLowerCase().includes(query)
      );
      if (models.length) filtered.push({ brand, models });
    });

    if (!filtered.length){
      tree.innerHTML = '<div class="empty-state">' + t('no_results', {query: currentSearch}) + '</div>';
      return;
    }

    tree.innerHTML = '';
    filtered.forEach(({brand, models}) => {
      const brandName = brand.brand_name;
      const selectedInBrand = cat.selected.get(brandName);
      const selectedCount = selectedInBrand ? selectedInBrand.size : 0;

      const block = document.createElement('div');
      block.className = 'brand-block';

      const row = document.createElement('div');
      row.className = 'brand-row' + (query ? ' open' : '');
      row.innerHTML =
        '<span class="chevron">▶</span>' +
        '<span class="brand-name">' + highlight(brandName, query) + '</span>' +
        '<span class="brand-meta">' + selectedCount + '/' + models.length + '</span>';
      row.addEventListener('click', () => {
        row.classList.toggle('open');
        modelsEl.classList.toggle('open');
      });
      block.appendChild(row);

      const modelsEl = document.createElement('div');
      modelsEl.className = 'models' + (query ? ' open' : '');
      models.forEach(model => {
        const modelName = model.model_name;
        const commandCount = Object.keys(model.commands || {}).length;
        const checked = isModelSelected(activeCategoryId, brandName, modelName);

        const modelRow = document.createElement('label');
        modelRow.className = 'model-row' + (checked ? ' checked' : '');

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = checked;
        cb.addEventListener('change', () => {
          setModelSelected(activeCategoryId, brandName, modelName, cb.checked);
          modelRow.classList.toggle('checked', cb.checked);
          row.querySelector('.brand-meta').textContent =
            (cat.selected.get(brandName) ? cat.selected.get(brandName).size : 0) + '/' + models.length;
          refreshChrome();
        });

        const nameSpan = document.createElement('span');
        nameSpan.className = 'model-name';
        nameSpan.innerHTML = highlight(modelName, query);

        const countSpan = document.createElement('span');
        countSpan.className = 'cmd-count';
        countSpan.textContent = t('cmd_count', {n: commandCount});

        modelRow.appendChild(cb);
        modelRow.appendChild(nameSpan);
        modelRow.appendChild(countSpan);
        modelsEl.appendChild(modelRow);
      });
      block.appendChild(modelsEl);
      tree.appendChild(block);
    });
  }

  function refreshChrome(){
    renderCategoryNav();
    const total = totalSelectionCount();
    selectionSummary.innerHTML = total === 0
      ? t('summary_none')
      : t('summary_n', {n: total});
    generateBtn.disabled = total === 0;
    saveDirectBtn.disabled = total === 0;
    sendRemoteBtn.disabled = total === 0;
  }

  // ---- category loading & selection ------------------------------

  async function selectCategory(id){
    activeCategoryId = id;
    searchBox.value = '';
    currentSearch = '';
    const cat = categories.get(id);

    if (!cat.data && !cat.loading && !cat.loadError){
      cat.loading = true;
      renderCategoryNav();
      renderTree();
      try{
        const res = await fetch(cat.file);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        cat.data = await res.json();
      } catch(err){
        cat.loadError = true;
        console.error('Failed to load ' + cat.file, err);
      } finally {
        cat.loading = false;
      }
    }

    searchBox.disabled = false;
    selectAllBtn.disabled = false;
    deselectAllBtn.disabled = false;
    renderCategoryNav();
    renderTree();
  }

  searchBox.addEventListener('input', () => {
    currentSearch = searchBox.value;
    renderTree();
  });

  selectAllBtn.addEventListener('click', () => {
    const cat = categories.get(activeCategoryId);
    if (!cat || !cat.data) return;
    (cat.data.brands || []).forEach(brand => {
      (brand.models || []).forEach(model => {
        setModelSelected(activeCategoryId, brand.brand_name, model.model_name, true);
      });
    });
    renderTree();
    refreshChrome();
  });

  deselectAllBtn.addEventListener('click', () => {
    const cat = categories.get(activeCategoryId);
    if (!cat) return;
    cat.selected.clear();
    renderTree();
    refreshChrome();
  });

  clearAllBtn.addEventListener('click', () => {
    categories.forEach(cat => cat.selected.clear());
    renderTree();
    refreshChrome();
  });

  // ---- export -------------------------------------------------------

  function buildCategoryExport(id){
    const cat = categories.get(id);
    if (!cat.data || cat.selected.size === 0) return null;
    const brandsOut = [];
    (cat.data.brands || []).forEach(brand => {
      const wanted = cat.selected.get(brand.brand_name);
      if (!wanted || wanted.size === 0) return;
      const modelsOut = (brand.models || []).filter(m => wanted.has(m.model_name));
      if (modelsOut.length) brandsOut.push({ brand_name: brand.brand_name, models: modelsOut });
    });
    if (!brandsOut.length) return null;
    return { category: cat.data.category, brands: brandsOut };
  }

  function downloadJson(filename, obj){
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  generateBtn.addEventListener('click', async () => {
    const toExport = [];
    categories.forEach((cat, id) => {
      if (categorySelectionCount(id) > 0) toExport.push(id);
    });
    if (!toExport.length) return;

    statusLine.textContent = t('status_generating', {n: toExport.length});

    for (let i = 0; i < toExport.length; i++){
      const id = toExport[i];
      const cat = categories.get(id);
      // Categories are only ever selected-into once their file has already
      // loaded (selecting a model requires the tree to be rendered, which
      // requires cat.data) — this data is never null here in practice, but
      // guard anyway rather than assume.
      if (!cat.data) continue;
      const exported = buildCategoryExport(id);
      if (!exported) continue;
      downloadJson(cat.file, exported);
      // Staggered: back-to-back downloads in the same tick get silently
      // blocked as a "download flood" by Chrome/Firefox popup-blocker-style
      // heuristics past 2-3 files.
      await new Promise(r => setTimeout(r, 350));
    }

    statusLine.textContent = t('status_done', {n: toExport.length});
  });

  // ---- direct save via the File System Access API (Chromium desktop; ----
  // ---- Android support is new and known to have bugs around creating -----
  // ---- new files/folders, so this stays a bonus, not the only way in) ---
  //
  // Remembers the folder you picked (the `id` option below) so repeat use
  // doesn't require re-navigating every time — the browser still asks for
  // a one-tap confirmation on later uses, it just starts in the same
  // place. Always writes into `<picked folder>/ir-database/`, creating
  // that subfolder if it isn't there yet; point the picker at wherever you
  // keep dashboard.json (usually a folder named "astrion").
  if ('showDirectoryPicker' in window){
    saveDirectBtn.style.display = '';
  }

  saveDirectBtn.addEventListener('click', async () => {
    const toExport = [];
    categories.forEach((cat, id) => {
      if (categorySelectionCount(id) > 0) toExport.push(id);
    });
    if (!toExport.length) return;

    let rootHandle;
    try{
      rootHandle = await window.showDirectoryPicker({ id: 'astrion-ir-database', mode: 'readwrite' });
    } catch(err){
      if (err.name === 'AbortError'){ statusLine.textContent = t('status_save_direct_cancelled'); return; }
      statusLine.textContent = t('status_save_direct_error', {error: err.message || err.name});
      console.error(err);
      return;
    }

    statusLine.textContent = t('status_saving_direct', {n: toExport.length});

    try{
      const dbHandle = await rootHandle.getDirectoryHandle('ir-database', { create: true });
      for (const id of toExport){
        const cat = categories.get(id);
        if (!cat.data) continue;
        const exported = buildCategoryExport(id);
        if (!exported) continue;
        const fileHandle = await dbHandle.getFileHandle(cat.file, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(JSON.stringify(exported, null, 2));
        await writable.close();
      }
      statusLine.textContent = t('status_saved_direct', { n: toExport.length, folder: rootHandle.name });
    } catch(err){
      statusLine.textContent = t('status_save_direct_error', {error: err.message || err.name});
      console.error(err);
    }
  });

  // ---- direct send to the remote's own local server (POST /ir-database) ---
  //
  // Same idea as icon uploads in the on-device web builder, just reached
  // over the LAN instead of from a page the remote serves itself — which
  // is exactly the catch: this page is HTTPS (GitHub Pages) and the
  // remote's ConfigServer is plain HTTP, so most browsers block this by
  // default as mixed content. Chrome is rolling out a "Local Network
  // Access" permission that's meant to allow exactly this, staged through
  // 2026 — so this may just start working over time without any change
  // here. Until then, it fails fast with an explanatory status message;
  // "Generate files" (copy to /sdcard/astrion/ir-database/ by hand) always
  // works regardless of any of this.

  function rememberedRemoteIp(){
    return localStorage.getItem('astrion_remote_ip') || '';
  }

  sendRemoteBtn.addEventListener('click', async () => {
    const toExport = [];
    categories.forEach((cat, id) => {
      if (categorySelectionCount(id) > 0) toExport.push(id);
    });
    if (!toExport.length) return;

    const ip = prompt(t('remote_ip_prompt'), rememberedRemoteIp());
    if (!ip) return;
    const base = ip.includes(':') ? ip : ip + ':8080';
    localStorage.setItem('astrion_remote_ip', ip);

    statusLine.textContent = t('status_sending_remote', {n: toExport.length, ip: base});

    try{
      for (const id of toExport){
        const cat = categories.get(id);
        if (!cat.data) continue;
        const exported = buildCategoryExport(id);
        if (!exported) continue;
        const blob = new Blob([JSON.stringify(exported, null, 2)], {type: 'application/json'});
        const form = new FormData();
        form.append('file', blob, cat.file);
        const res = await fetch(`http://${base}/ir-database`, {
          method: 'POST',
          headers: {'Accept': 'application/json'},
          body: form
        });
        if (!res.ok) throw new Error(`HTTP ${res.status} (${(await res.text()).slice(0, 200)})`);
      }
      statusLine.textContent = t('status_sent_remote', {n: toExport.length});
    } catch(err){
      statusLine.textContent = t('status_send_remote_blocked', {error: err.message || String(err)});
      console.error(err);
    }
  });

  // ---- boot -----------------------------------------------------------

  async function init(){
    try{
      const res = await fetch('index.json');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const idx = await res.json();
      (idx.categories || []).forEach(c => {
        categories.set(c.id, {
          label: c.label, file: c.file,
          data: null, loading: false, loadError: false,
          selected: new Map()
        });
      });
      renderCategoryNav();
      tree.innerHTML = '<div class="empty-state">' + t('choose_category') + '</div>';
      refreshChrome();
    } catch(err){
      tree.innerHTML = '<div class="empty-state">' + t('index_load_error') + '</div>';
      console.error(err);
    }
  }

  init();
})();
</script>

</body>
</html>
