[tool.ruff]
line-length = 100
target-version = "py311"
 
[tool.ruff.lint]
# Sensible default set: pyflakes, pycodestyle, isort, bugbear, and
# comprehension/simplify checks. Not exhaustive -- the goal is to catch real
# mistakes (unused imports, bare excepts, mutable default args) without
# fighting the whole codebase on style nits.
select = ["E", "F", "W", "I", "B", "C4", "SIM"]
ignore = [
    "E501", # line-length is handled by ruff format instead
]
 
[tool.ruff.lint.isort]
known-first-party = ["app"]
 
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
