substitutions:
  name: "astrion-ir-sniffer"
  friendly_name: "Astrion IR Sniffer"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"

esp8266:
  board: esp8285
  restore_from_flash: true

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret key
  # Pronto-only replay, used by the sniffer's Learning Mode "test" button to
  # re-emit a just-captured code at the real device, confirming it decoded
  # cleanly before you save it. Replaces the old five-protocol `send_ir`
  # service — Astrion only ever transmits Pronto (ConsumerIrManager pattern
  # data is derived from Pronto at build/runtime), so there was never a
  # reason to carry LG/PANASONIC/PIONEER/SAMSUNG/SONY-specific transmit
  # lambdas here.
  services:
    - service: send_pronto
      variables:
        code: string
      then:
        - logger.log:
            format: "Replaying Pronto: %s"
            args: [ "code.c_str()" ]
        - remote_transmitter.transmit_pronto:
            data: !lambda 'return code.c_str();'

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${friendly_name} AP"
    password: !secret wifi_pass

captive_portal:

web_server:
  port: 80

sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "${friendly_name} Uptime"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
      disabled_by_default: true
    ssid:
      name: "${friendly_name} SSID"
    bssid:
      name: "${friendly_name} BSSID"
    mac_address:
      name: "${friendly_name} Mac Wifi Address"
    scan_results:
      name: "${friendly_name} Latest Scan Results"

switch:
  - platform: restart
    name: "${friendly_name} restart"

binary_sensor:
  - platform: status
    name: "${friendly_name} IR Status"

  - platform: gpio
    pin: GPIO0
    id: physical_button

status_led:
  pin: GPIO13

remote_transmitter:
  pin:
    number: GPIO4
  carrier_duty_percent: 50%

remote_receiver:
  pin:
    number: GPIO5
    inverted: true
  # Pronto-only: previously `dump: all` decoded and logged every protocol
  # ESPHome knows (LG/NEC/Panasonic/Pioneer/Samsung/Sony/JVC/...), producing
  # noisy, protocol-specific log lines the sniffer never used (app.py only
  # ever grepped for 4-hex-char tokens regardless of protocol). Restricting
  # the dump to `pronto` means every capture — Harmony-driven bulk export
  # AND Learning Mode — sees exactly one clean log format to parse, and nothing
  # else fires spuriously while listening for the next button press.
  dump: pronto
  on_pronto:
    then:
      - homeassistant.event:
          event: esphome.ir_pronto_code_received
          data:
            code: !lambda 'return x.data;'